[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creacut"
version = "0.1.0"
description = "Automated video editing pipeline: green-screen video + script → polished final cut"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "AUTHORS.md", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "moviepy>=2.0",
    "imageio-ffmpeg>=0.5",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
    "pypdfium2>=4.30",
    "python-pptx>=1.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
whisper = ["openai-whisper>=20231117"]
llm = ["ollama>=0.4", "anthropic>=0.20"]
ui = ["PySide6>=6.7,<7"]
desktop = [
    "openai-whisper>=20231117",
    "PySide6>=6.7,<7",
    "pywin32>=306; sys_platform == 'win32'",
    "pyinstaller>=6.0",
]
all = [
    "openai-whisper>=20231117",
    "ollama>=0.4",
    "anthropic>=0.20",
    "PySide6>=6.7,<7",
]
dev = ["pytest>=7.0"]

[project.scripts]
creacut = "creacut.cli:main"
creacut-editor = "creacut.ui.launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
